name: Make Xposed Test Package

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Grab source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant permission shell scripts
        run: chmod +x .github/*.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - uses: r0adkll/sign-android-release@v1
        name: Sign app APK
        if: ${{ secrets.SIGNING_KEY != '' && secrets.ALIAS != '' && secrets.KEY_STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '33.0.0'

      - name: Magisk Module Generation
        run: .github/make_debug_zip.sh

      - name: Upload signed APK file
        if: ${{ steps.sign_app.outcome == 'success' }}
        uses: actions/upload-artifact@v2
        with:
          name: PixelXpert_Xposed_signed.apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Upload unsigned APK file
        if: ${{ steps.sign_app.outcome != 'success' }}
        uses: actions/upload-artifact@v2
        with:
          name: PixelXpert_Xposed_unsigned_debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed Xposed Artifact to Actions
        if: ${{ steps.sign_app.outcome == 'success' }}
        uses: actions/upload-artifact@v2
        with:
          name: PixelXpert_Xposed_signed.zip
          path: output

      - name: Upload unsigned Xposed Artifact to Actions
        if: ${{ steps.sign_app.outcome != 'success' }}
        uses: actions/upload-artifact@v2
        with:
          name: PixelXpert_Xposed_unsigned_test.zip
          path: output
